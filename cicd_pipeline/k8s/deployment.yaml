apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: devops-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: neha-cicd-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
