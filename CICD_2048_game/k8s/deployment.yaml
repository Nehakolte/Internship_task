apiVersion: apps/v1
kind: Deployment
metadata:
  name: 2048-game
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: 2048-game

  template:
    metadata:
      labels:
        app: 2048-game

    spec:
      containers:
        - name: 2048-game
          image: neha401/cicd-2048-game:14

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

